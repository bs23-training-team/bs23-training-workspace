packages:
  - "apps/*"
  - "packages/*"

# pnpm blocks dependency install scripts unless they are listed here.
# true  = allowed to run, false = intentionally skipped (prebuilt binaries are used instead).
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  argon2: false
  prisma: true
  protobufjs: true
  sharp: false
  unrs-resolver: false