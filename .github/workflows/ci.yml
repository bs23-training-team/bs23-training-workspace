# CI release gate (SRS p.9): runs on every PR into develop/main and on every push to them.
# A red check blocks the merge once it is set as a required status check in the branch ruleset.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test, migrations, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A real, empty PostgreSQL for every run (SRS: test on PostgreSQL, not SQLite).
    # Same major version as Neon and local Docker.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bs23_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d bs23_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI-only throwaway database. Not a secret.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/bs23_ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/bs23_ci
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies (locked)
        run: pnpm install --frozen-lockfile

      - name: Prisma schema is valid
        run: pnpm db:validate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Migrations apply cleanly to an empty database
        run: |
          if [ -d apps/api/prisma/migrations ]; then
            pnpm db:deploy
          else
            echo "No migrations yet. Skipping."
          fi

      - name: Schema and migrations are in sync
        run: |
          pnpm --filter api exec prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema \
            --exit-code \
          || {
            echo "::error::The Prisma schema has changes that are not in a migration. Run 'pnpm db:migrate --name <change>' locally and commit the new migration folder."
            exit 1
          }

      - name: Build
        run: pnpm build

      - name: Smoke test (API starts and reaches the database)
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health/ready; then echo; echo "API is ready"; exit 0; fi
            sleep 1
          done
          echo "::error::API did not become ready in 30s"
          cat api.log
          exit 1
