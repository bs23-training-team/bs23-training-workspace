# Local development only. These credentials are NOT used anywhere else.
name: bs23

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: bs23
      POSTGRES_PASSWORD: bs23_local_password
      POSTGRES_DB: bs23_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bs23 -d bs23_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
